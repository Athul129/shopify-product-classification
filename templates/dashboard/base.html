<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopify Classifier</title><style>
:root{--ink:#172033;--muted:#64748b;--line:#e2e8f0;--surface:#fff;--bg:#f1f5f9;--blue:#2563eb;--green:#15803d;--amber:#b45309;--red:#b91c1c;--purple:#7e22ce}*{box-sizing:border-box}body{font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}nav{background:var(--ink);padding:0 5%;display:flex;align-items:center;gap:4px;min-height:58px}nav .brand{font-weight:700;color:white;margin-right:22px}nav a{color:#cbd5e1;padding:19px 12px;text-decoration:none;border-bottom:3px solid transparent}nav a:hover,nav a.active{color:white;background:#26334b;border-bottom-color:#60a5fa}.wrap{max-width:1280px;margin:30px auto;padding:0 20px}h1{font-size:28px;margin:0 0 6px}h2{font-size:19px;margin-top:0}.muted{color:var(--muted)}.card{background:var(--surface);padding:20px;margin:14px 0;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px #0f172a0b}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat{padding:17px;background:white;border:1px solid var(--line);border-radius:10px}.stat strong{display:block;font-size:25px;margin-top:4px}.stat-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}td,th{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:hover td{background:#f8fbff}a{color:#1d4ed8}input,select,button{font:inherit;padding:9px 11px;margin:4px;border:1px solid #cbd5e1;border-radius:6px}button{background:var(--blue);border-color:var(--blue);color:white;cursor:pointer;font-weight:600}button:hover{filter:brightness(.93)}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}.status-classified{background:#dcfce7;color:var(--green)}.status-needs_review{background:#fef3c7;color:var(--amber)}.status-approved{background:#dbeafe;color:#1d4ed8}.status-failed{background:#fee2e2;color:var(--red)}.method-rule{background:#e0f2fe;color:#0369a1}.method-ai{background:#f3e8ff;color:var(--purple)}.method-manual{background:#dbeafe;color:#1d4ed8}.method-hybrid{background:#ede9fe;color:#6d28d9}.category-highlight{font-size:19px;font-weight:700;color:#0f3d7a}.table-wrap{overflow-x:auto}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.review-item{display:flex;justify-content:space-between;gap:20px;align-items:center}.confidence{font-weight:700}.message{border-left:4px solid var(--green)}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}nav{flex-wrap:wrap}.grid-2{grid-template-columns:1fr}}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 12px}.review-item{display:block}}
</style></head><body><nav><span class="brand">Shopify Taxonomy</span><a href="{% url 'dashboard:index' %}">Dashboard</a><a href="{% url 'dashboard:products' %}">Products</a><a href="{% url 'dashboard:review' %}">Review</a><a href="{% url 'dashboard:import' %}">Import</a><a href="{% url 'dashboard:classify' %}">Classification</a></nav><main class="wrap">{% if messages %}{% for message in messages %}<div class="card message">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
